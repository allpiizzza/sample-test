        <div class="review-meta">
          <span class="review-author">이미예</span>
          <span class="review-date">2026.08.02</span>
        </div>

        <p class="detail-content">
          잠든 사이에만 찾아갈 수 있다는 신비한 백화점에서, 사람들이 저마다의
          꿈을 사 간다는 설정이 무척 매력적이었다. 현실적인 고민을 안고 사는
          인물들이 꿈을 통해 위로받는 장면들을 보면서, 나도 모르게 마음이
          몽글몽글해졌다. 문장 하나하나가 부드럽고 따뜻해서, 지친 하루 끝에 읽기
          딱 좋은 책이었다. 다음 편도 꼭 읽어봐야겠다.
        </p>

        <div class="detail-actions">
          <button type="button" class="btn btn-outline">수정하기</button>
